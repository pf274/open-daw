<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OpenDAW</title>
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Whistle the pitch, tap the rhythm, get MIDI.">
  <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OpenDAW">
  <script>
    // apply the saved / system theme before anything paints (stores/theme.js takes over once the app loads)
    try {
      var t = localStorage.getItem('open-daw-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable: dark */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
